[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/media/gallery/*"
  to = "/.netlify/functions/api"
  status = 200
